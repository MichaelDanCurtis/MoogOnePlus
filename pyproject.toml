[project]
name = "moogone"
version = "0.1.0"
description = "OSC tooling for the Moog One's SuperCollider audio engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26", "soundfile>=0.12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
vox = ["websockets>=13", "python-rtmidi>=1.5"]

[project.scripts]
moogone = "moogone.cli:main"
vox = "moogone.vox.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moogone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Plan docs embed class-body fragments in ```python blocks ("Add to `ScClient`:").
# Ruff formats each block as a standalone module and de-indents the methods to
# column 0, which breaks the paste-in instructions. No .py files live here.
extend-exclude = ["docs/"]
